<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendas por Categoria</title>
<link rel="stylesheet" href="style.css">


</head>
<body>

<div class="contCliente">
    <h2>Dados do Cliente</h2>

    <div class="filters">
        <div>
            <label>Data início</label><br>
            <input type="datetime-local">
        </div>

        <div>
            <label>Data fim</label><br>
            <input type="datetime-local">
        </div>

        <button class="btnCliente">Pesquisar</button>
    </div>

    <table>
        <thead>
            <tr>
                <th id="Nome">Nome</th>
                <th>Telefone</th>
                <th>Descrição</th>
              
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Sabores</td>
                <td>R$ 4.123,00</td>
                <td>R$ 2.117,00</td>
                
            </tr>

            <tr>
                <td>Milkshake</td>
                <td>R$ 1.101,00</td>
                <td>R$ 311,00</td>
                
            </tr>

            <tr>
                <td>Combos</td>
                <td>R$ 512,00</td>
                <td>R$ 123,00</td>
               
            </tr>

           
        </tbody>
    </table>
</div>

</body>
</html>
