<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro e Solicitação de Serviço</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

<div class="form-container">
    <h2>Cadastro e Solicitação de Serviço</h2>

    <form>
        <label>Nome:</label>
        <input type="text" name="nome" required>

        <label>Telefone:</label>
        <input type="text" name="telefone" required>

        <label>Descrição:</label>
        <textarea name="descricao" required></textarea>

        <div class="buttons">
            <button type="button" class="btn-back" onclick="history.back()">Voltar</button>
            <button type="submit" class="btn-submit">Solicitar</button>
        </div>
    </form>
</div>

  <script src="script.js"></script>

</body>
</html>
